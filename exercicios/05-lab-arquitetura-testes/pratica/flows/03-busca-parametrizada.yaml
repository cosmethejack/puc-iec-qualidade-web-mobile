appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
- runFlow: _fragments/abrir-busca.yaml

# 1ª Busca: Matrix
- runFlow:
    file: _fragments/buscar.yaml
    env:
      TERM: "Matrix"

# Limpa o campo para a próxima busca
- tapOn:
    id: "search-clear-button"

# 2ª Busca: Avatar
- runFlow:
    file: _fragments/buscar.yaml
    env:
      TERM: "Avatar"