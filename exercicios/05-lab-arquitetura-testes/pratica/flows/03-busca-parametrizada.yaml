# ✅ AVALIATIVO — NÍVEL 3: chama o fragmento parametrizado 2 vezes com termos diferentes.
appId: com.puciec.cinefav
tags:
  - regressao
---
- launchApp
- runFlow: _fragments/abrir-busca.yaml

- runFlow:
    file: _fragments/buscar.yaml
    env:
      TERM: "Matrix"

- tapOn:
    id: "search-clear-button"

- runFlow:
    file: _fragments/buscar.yaml
    env:
      TERM: "Avatar"