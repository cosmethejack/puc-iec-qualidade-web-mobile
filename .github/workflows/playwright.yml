name: Playwright Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. Gera os arquivos estáticos na pasta dist/
      - name: Build project
        run: npx vite build

      # 2. Sobe a pasta dist estática com o pacote 'serve'
      - name: Serve build in background
        run: npx serve -s dist -l 5174 &

      # 3. Aguarda o servidor responder na porta 5174
      - name: Wait for Server
        run: npx wait-on http://127.0.0.1:5174 --timeout 60000

      # 4. Executa os testes
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30