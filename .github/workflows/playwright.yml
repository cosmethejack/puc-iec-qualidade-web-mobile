name: Playwright Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. Inicia o servidor Vite na porta 5174 escutando em todas as interfaces (0.0.0.0)
      - name: Start Application Server
        run: npm run dev -- --host 0.0.0.0 --port 5174 &

      # 2. Aguarda a aplicação responder no IP local
      - name: Wait for Server
        run: npx wait-on http://127.0.0.1:5174 --timeout 60000

      # 3. Executa os testes
      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30