name: Playwright Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 1. Instala dependências e inicia a aplicação injetando as variáveis de ambiente
      - name: Install & Start Application
        env:
          VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN || 'dummy_token' }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || 'dummy_key' }}
        run: |
          cd app
          npm ci
          npm run dev &

      # 2. Instala dependências do projeto de testes Playwright
      - name: Install Test Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 3. Aguarda o servidor responder na porta 5174
      - name: Wait for Server
        run: npx wait-on http://127.0.0.1:5174 --timeout 90000

      # 4. Executa a suíte de testes Playwright
      - name: Run Playwright tests
        run: npx playwright test

      # 5. Salva o relatório de testes em HTML
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30